name: "Greet User Docker Action"
description: "Salue un utilisateur avec un message personnalisé"
inputs:
  username:
    description: "Nom de l'utilisateur à saluer"
    required: true
  greeting:
    description: "Message de salutation"
    required: false
    default: "Bonjour"
outputs:
  message:
    description: "Le message complet de salutation"
runs:
  using: "docker"
  image: "Dockerfile"